<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Emptio</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#home"><img src="EmptioPNG2.png" alt="Emptio" width="150px"></a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup"
                aria-labelledby="navbarNavAltMarkupLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body d-flex justify-content-between align-items-center px-3">
                    <div class="nav nav-pills navbar-nav">
                        <a class="nav-link" href="#carrinho">Carrinho</a>
                        <a class="nav-link" href="#historico">Histórico</a>
                    </div>
                    <div class="nav nav-pills navbar-nav me-2">
                        <a class="nav-link" href="#perfil">Perfil</a>
                    </div>
                </div>
            </dialog>
        </div>
    </nav>

    <section id="historico" hidden>

        <form class="hstack gap-2" role="search">
            <input class="form-control" type="search" placeholder="Buscar" aria-label="Search" />
        </form>

        <div class="history-card-list"></div>
    </section>

    <section id="carrinho" hidden>
        <div class="layout-carrinho">

            <div class="card card-translucent cart-summary">
                <div class="card-body">
                    <h4 class="card-title">Resumo do Carrinho</h4>
                    <div class="lista-resumo"></div>
                    <div class="resumo-total">
                        <span>Total do carrinho</span>
                        <strong id="total-carrinho">R$ 0,00</strong>
                    </div>
                    <div class="resumo-acoes">
                        <button type="button" class="btn-solid theme-secondary cancelar-acesso-carrinho"
                            hidden>Cancelar</button>
                        <a href="#" id="botao-resumo-carrinho" class="btn-solid theme-primary" data-bs-toggle="dialog"
                            data-bs-target="#exampleDialogDark2">Finalizar Carrinho</a>
                    </div>
                </div>
            </div>

            <div class="container cart-grid">

                <form class="hstack gap-2" role="search">
                    <input class="form-control" type="search" placeholder="Buscar" aria-label="Search" />
                </form>

                <div class="product-list">

                </div>
            </div>
            <div class="d-grid gap-2 cart-actions-container">
                <div class="btn-group btn-group-divider cart-actions" role="group" aria-label="Ações do carrinho">
                    <button type="button" class="btn-solid theme-primary add-product-button" data-bs-toggle="dialog"
                        data-bs-target="#exampleDialogDark">Adicionar Produto</button>
                </div>
            </div>
        </div>

        <dialog class="dialog" id="exampleDialogDark" data-bs-theme="dark">
            <div class="dialog-header">
                <h1 class="dialog-title">Adicionar Produto</h1>
                <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
            </div>
            <div class="dialog-body">
                <form id="productForm" class="product-form">
                    <div class="product-form-fields">
                        <div class="form-field">
                            <button class="form-control combobox-toggle" type="button" data-bs-toggle="combobox"
                                data-bs-name="role" data-bs-placeholder="Selecionar Produto">
                                <span class="combobox-value">Selecionar Produto</span>
                                <svg class="combobox-caret" width="10" height="16" viewBox="0 0 10 16" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z"
                                        fill="currentcolor" />
                                </svg>
                            </button>
                            <div class="menu">


                            </div>
                        </div>
                        <div class="form-field">
                            <label for="validationDefault01" class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="validationDefault01"
                                placeholder="Nome do Produto" required>
                        </div>
                        <div class="form-field">
                            <label for="validationDefaultValue" class="form-label">Valor</label>
                            <div class="input-group">
                                <span class="input-group-text" id="inputGroupPrepend2">R$</span>
                                <input type="text" class="form-control" id="validationDefaultValue" placeholder="0,00"
                                    inputmode="numeric" aria-describedby="inputGroupPrepend2" required>
                            </div>
                        </div>
                        <div class="form-field">
                            <label for="validationDefaultQuantity" class="form-label">Quantidade</label>
                            <div class="input-group">
                                <span class="input-group-text" id="inputGroupPrepend2">Qtd</span>
                                <input type="number" class="form-control" id="validationDefaultQuantity" placeholder="0"
                                    min="1" aria-describedby="inputGroupPrepend2" required>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Cancelar</button>
                <button id="adicionar" type="submit" form="productForm"
                    class="btn-solid theme-primary adicionar">Adicionar</button>
            </div>
        </dialog>

        <dialog class="dialog" id="exampleDialogDark2" data-bs-theme="dark">
            <div class="dialog-header">
                <h1 class="dialog-title">Finalizar Carrinho</h1>
                <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
            </div>
            <div class="dialog-body">
                <form id="productForm2" class="product-form">
                    <div class="product-form-fields">
                        <div class="form-field">
                            <label for="validationDefault01" class="form-label">Nome do Carrinho</label>
                            <input type="text" class="form-control" id="nomecarrinho" placeholder="Nome do Carrinho"
                                required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Cancelar</button>
                <button type="submit" form="productForm2" class="btn-solid theme-primary adicionar">Finalizar</button>
            </div>
        </dialog>

        <dialog class="dialog" id="exampleDialogDark3" data-bs-theme="dark">
            <div class="dialog-header">
                <h1 class="dialog-title">Editar Produto</h1>
                <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
            </div>
            <div class="dialog-body">
                <form id="productForm3" class="product-form">
                    <div class="product-form-fields">
                        <div class="form-field">
                            <label for="validationDefault01" class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="validationDefault01"
                                placeholder="Nome do Produto" required>
                        </div>
                        <div class="form-field">
                            <label for="validationDefaultValue" class="form-label">Valor</label>
                            <div class="input-group">
                                <span class="input-group-text" id="inputGroupPrepend2">R$</span>
                                <input type="number" class="form-control" id="validationDefaultValue" placeholder="0"
                                    min="0" aria-describedby="inputGroupPrepend2" required>
                            </div>
                        </div>
                        <div class="form-field">
                            <label for="validationDefaultQuantity" class="form-label">Quantidade</label>
                            <div class="input-group">
                                <span class="input-group-text" id="inputGroupPrepend2">Qtd</span>
                                <input type="number" class="form-control" id="validationDefaultQuantity" placeholder="0"
                                    min="0" aria-describedby="inputGroupPrepend2" required>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Cancelar</button>
                <button id="adicionar" type="submit" form="productForm3"
                    class="btn-solid theme-primary adicionar">Confirmar</button>
            </div>
        </dialog>

    </section>

    <section id="perfil" hidden>
        <div class="perfil-wrapper">
            <div class="card card-translucent perfil-card">
                <div class="card-body">
                    <h4 class="card-title text-center mb-4">Meu Perfil</h4>
                    <form id="perfilForm" class="perfil-form">
                        <div class="form-field mb-3 text-start">
                            <label for="perfilName" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="perfilName" required>
                        </div>
                        <div class="form-field mb-3 text-start">
                            <label for="perfilUsername" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="perfilUsername" required>
                        </div>
                        <div class="form-field mb-4 text-start">
                            <label for="perfilPassword" class="form-label">Nova Senha (opcional)</label>
                            <input type="password" class="form-control" id="perfilPassword"
                                placeholder="Deixe em branco para manter a atual">
                        </div>

                        <!-- Botões de ação centralizados -->
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn-solid theme-primary">Salvar Alterações</button>
                            <button type="button" class="btn-solid theme-danger" id="botaoSairPerfil">Sair</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
