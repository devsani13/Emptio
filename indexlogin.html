<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">

    <title>Emptio</title>
    <link rel="stylesheet" type="text/css" href="stylelogin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <div class="layout-login">
        <form class="form-login" id="loginForm">
            <h2>Login</h2>
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
            <p class="form-switch-text">Não possui uma conta? <a href="#" class="form-switch-link"
                    data-show-form="registerForm">Registre-se</a></p>
        </form>

        <form class="form-login" id="registerForm" hidden>
            <h2>Cadastro</h2>
            <div class="mb-3">
                <label for="registerName" class="form-label">Nome</label>
                <input type="text" class="form-control" id="registerName" name="name" required>
            </div>
            <div class="mb-3">
                <label for="registerUsername" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="registerUsername" name="username" required>
            </div>
            <div class="mb-3">
                <label for="registerPassword" class="form-label">Senha</label>
                <input type="password" class="form-control" id="registerPassword" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar</button>
            <p class="form-switch-text">Já possui uma conta? <a href="#" class="form-switch-link"
                    data-show-form="loginForm">Entre</a></p>
        </form>
    </div>

    <script src="login.js"></script>
    <script src="script.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
